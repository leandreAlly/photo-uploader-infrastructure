template-file-path: packaged/main.yaml
parameters:
  ProjectName: photo-uploader
  DbName: photos
  DbUsername: appuser
  DbInstanceClass: db.t3.micro
  S3PrefixListId: pl-63a5400a
  GitHubOwner: leandreAlly
  ApplicationRepo: photo-uploader-app
  GitHubOwnerId: '78492995'
  RepositoryName: photo-uploader-app
  DbMultiAz: 'true'
  DbBackupRetentionDays: 7
  DbDeletionProtection: 'false'
  TestListenerCidr: 127.0.0.1/32
  CloudFrontPriceClass: PriceClass_200
  TaskCpu: '256'
  TaskMemory: '512'
  MinCapacity: 1
  MaxCapacity: 4
  CpuTargetUtilization: 60
  ImagePrefix: images/
  # The application workflow publishes one moving tag; CodeDeploy rolls out each
  # new image behind it.
  ImageTag: latest
  # Empty until the platform stack has registered its first revision. Pin it
  # afterwards so template changes never ask ECS to move a CODE_DEPLOY service
  # onto a new task definition.
  ServiceTaskDefinitionArn: ''
tags:
  project: photo-uploader
  managed-by: cloudformation-gitsync
