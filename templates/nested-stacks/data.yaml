AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Photo Uploader - relational store for image metadata.
  A PostgreSQL instance in the private subnets, reachable only from the ECS
  task security group. The master credentials are generated by Secrets Manager
  and never appear in the template, a parameter or the stack events; the
  application reads them at task start through the execution role.

Parameters:
  ProjectName:
    Type: String
    Default: photo-uploader
    AllowedPattern: '[a-z][a-z0-9-]*'

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  DbName:
    Type: String
    Default: photos
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'
  DbUsername:
    Type: String
    Default: appuser
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'

  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
    Description: The lab requires the db.t3 family

  DbEngineVersion:
    Type: String
    Default: '16.4'

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100

  MultiAz:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Enabled by default for high availability. Set to false only when a lower
      cost disposable lab deployment is explicitly preferred.

  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Number of days to retain automated RDS backups

  DeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Prevent accidental RDS deletion in non-disposable environments

Resources:
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/database'
      Description: !Sub 'Master credentials for the ${ProjectName} database'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: layer
          Value: data
        - Key: managed-by
          Value: cloudformation-gitsync

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${ProjectName} private subnets'
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: layer
          Value: data
        - Key: managed-by
          Value: cloudformation-gitsync

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-db'
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroupId
      MultiAZ: !Ref MultiAz
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref BackupRetentionDays
      DeletionProtection: !Ref DeletionProtection
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-db'
        - Key: project
          Value: !Ref ProjectName
        - Key: layer
          Value: data
        - Key: managed-by
          Value: cloudformation-gitsync

  # Writes host, port, dbname and engine back into the secret, so the
  # application reads one JSON document instead of stitching values together.
  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

  DbFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-db-free-storage'
      AlarmDescription: RDS free storage is below 2 GiB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Minimum
      Unit: Bytes
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: layer
          Value: observability
        - Key: managed-by
          Value: cloudformation-gitsync

Outputs:
  DbSecretArn:
    Description: Secret the task definition injects credentials from
    Value: !Ref DbSecret
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DbPort:
    Value: !GetAtt Database.Endpoint.Port
  DbName:
    Value: !Ref DbName
  DbInstanceIdentifier:
    Value: !Ref Database
