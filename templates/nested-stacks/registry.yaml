AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS CI/CD - container registry and the CI identity that writes to it.
  A private ECR repository with immutable tags, plus the IAM role the
  application repository's GitHub Actions workflow assumes through OIDC.
  Deployed before the platform stack because an ECS service cannot start
  without an image already present.

Parameters:
  ProjectName:
    Type: String
    Default: photo-uploader
    AllowedPattern: '[a-z][a-z0-9-]*'

  RepositoryName:
    Type: String
    Default: photo-uploader-app
    AllowedPattern: '[a-z0-9][a-z0-9._/-]*'

  GitHubOwner:
    Type: String
    Default: leandreAlly
  GitHubRepo:
    Type: String
    Default: photo-uploader-app

  GitHubOwnerId:
    Type: String
    Default: '78492995'
    AllowedPattern: '[0-9]+'
    Description: >
      Numeric GitHub owner ID. Repositories created after 2026-07-15 emit an
      immutable OIDC subject claim of the form
      repo:owner@ownerid/repo@repoid:ref:... instead of repo:owner/repo:ref:...

Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      # The lab uses latest as a rolling deployment tag, so the repository must
      # allow that tag to be overwritten by each successful application build.
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Ref RepositoryName
        - Key: project
          Value: !Ref ProjectName
        - Key: layer
          Value: registry
        - Key: managed-by
          Value: cloudformation-gitsync

  GitHubActionsEcrRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Lets GitHub Actions in ${GitHubOwner}/${GitHubRepo} push images to ${RepositoryName}'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@*:ref:refs/heads/main'
      Policies:
        - PolicyName: EcrPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AuthenticateToRegistry
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushToProjectRepositoryOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

Outputs:
  RepositoryName:
    Value: !Ref EcrRepository
  RepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  RepositoryArn:
    Value: !GetAtt EcrRepository.Arn
  GitHubActionsRoleArn:
    Description: Value for the AWS_ECR_ROLE_ARN secret in the application repository
    Value: !GetAtt GitHubActionsEcrRole.Arn
