AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS CI/CD - network foundation.
  A two-AZ VPC whose private subnets have no route to the internet: ECS tasks
  reach ECR, S3 and CloudWatch Logs through VPC endpoints instead of a NAT
  gateway. Also owns every security group, so the ALB/task/endpoint rules can
  reference each other without cross-stack circularity.

Parameters:
  ProjectName:
    Type: String
    Default: photo-uploader
    AllowedPattern: '[a-z][a-z0-9-]*'

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/24

  ContainerPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535

  TestListenerPort:
    Type: Number
    Default: 9000
    MinValue: 1
    MaxValue: 65535

  TestListenerCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: CIDR allowed to reach the optional CodeDeploy test listener

  DatabasePort:
    Type: Number
    Default: 5432
    MinValue: 1
    MaxValue: 65535

  S3PrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: >
      Managed prefix list for S3 in this region. Find it with:
      aws ec2 describe-managed-prefix-lists --region <region>
      --filters Name=prefix-list-name,Values=com.amazonaws.<region>.s3
      --query 'PrefixLists[0].PrefixListId' --output text

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-1'
        - Key: Tier
          Value: public
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-2'
        - Key: Tier
          Value: public
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-1'
        - Key: Tier
          Value: private
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-2'
        - Key: Tier
          Value: private
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-rt-1'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-rt-2'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public entry point - accepts HTTP from the internet
      VpcId: !Ref Vpc
      # A local-only rule prevents the implicit allow-all default egress rule.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Production listener
        - IpProtocol: tcp
          FromPort: !Ref TestListenerPort
          ToPort: !Ref TestListenerPort
          CidrIp: !Ref TestListenerCidr
          Description: CodeDeploy test listener for blue/green validation
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Fargate tasks - reachable only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-task-sg'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL - reachable only from the ECS tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-db-sg'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints - HTTPS from tasks only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-endpoint-sg'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  AlbEgressToTasks:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      DestinationSecurityGroupId: !Ref TaskSecurityGroup
      Description: Forward requests to ECS tasks

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Application traffic and health checks from the ALB

  TaskEgressToEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VpcEndpointSecurityGroup
      Description: ECR API, ECR Docker and CloudWatch Logs over the interface endpoints

  TaskEgressToS3:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref S3PrefixListId
      Description: ECR image layers are stored in S3, reached via the gateway endpoint

  DatabaseIngressFromTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DatabasePort
      ToPort: !Ref DatabasePort
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: Metadata queries from the application

  TaskEgressToDatabase:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DatabasePort
      ToPort: !Ref DatabasePort
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: PostgreSQL

  EndpointIngressFromTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: HTTPS from ECS tasks

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-s3-endpoint'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ecr-api-endpoint'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ecr-dkr-endpoint'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-logs-endpoint'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

  # Without this the execution role cannot fetch the database secret at task
  # start: these subnets have no NAT gateway, so every AWS API call a task or
  # its agent makes has to have an endpoint in the VPC.
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-secretsmanager-endpoint'
        - Key: project
          Value: !Ref ProjectName
        - Key: managed-by
          Value: cloudformation-gitsync

Outputs:
  VpcId:
    Value: !Ref Vpc
  VpcCidr:
    Value: !GetAtt Vpc.CidrBlock
  PublicSubnetIds:
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  PrivateSubnetIds:
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  ContainerPort:
    Value: !Ref ContainerPort
  TestListenerPort:
    Value: !Ref TestListenerPort
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  DatabasePort:
    Value: !Ref DatabasePort
